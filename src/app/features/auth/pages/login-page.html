<div class="auth">
  <div class="auth__top">
    <app-back-button fallback="/inicio" />
  </div>

  <div class="auth-card stagger">
    <p class="text-label auth__overline">Bienvenido de nuevo</p>
    <h1 class="auth__title">Iniciar sesión</h1>

    <form class="form" [formGroup]="form" (ngSubmit)="entrar()" novalidate>
      @if (error(); as mensaje) {
        <p class="form__alert" role="alert">{{ mensaje }}</p>
      }

      <div class="field">
        <label class="field__label" for="login-email">Correo electrónico</label>
        <input
          id="login-email"
          class="input"
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="nombre@ejemplo.com"
          aria-describedby="login-email-error"
        />
        <app-field-error [control]="form.controls.email" [mensajes]="mensajes.email" idError="login-email-error" />
      </div>

      <div class="field">
        <label class="field__label" for="login-password">Contraseña</label>
        <input
          id="login-password"
          class="input"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          placeholder="Tu contraseña"
          aria-describedby="login-password-error"
        />
        <app-field-error
          [control]="form.controls.password"
          [mensajes]="{ required: 'La contraseña es obligatoria.' }"
          idError="login-password-error"
        />
      </div>

      <button type="submit" class="btn btn--primary btn--lg auth__submit" [disabled]="enviando() || form.invalid">
        {{ enviando() ? 'Entrando…' : 'Continuar' }}
      </button>

      <p class="divider">o</p>

      <app-google-button [deshabilitado]="enviando()" (pulsar)="entrarConGoogle()" />
    </form>

    <p class="auth__switch">
      ¿No tienes cuenta? <a routerLink="/registro">Regístrate aquí</a>
    </p>
  </div>
</div>
