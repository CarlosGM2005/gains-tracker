<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>GainsTracker</title>
    <base href="/" />
    <!-- `viewport-fit=cover` deja que la app pinte bajo la barra de estado y el indicador de iOS. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="GainsTracker: mide, mejora y supera tus límites en el gimnasio." />
    <meta name="theme-color" content="#0e0e10" />
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="logo.svg" />

    <!-- PWA -->
    <link rel="manifest" href="manifest.webmanifest" />

    <!-- iOS: Safari no lee el manifest para el icono ni para el modo app. Necesita sus etiquetas. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GainsTracker" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/app/apple-touch-icon-180.png" />

    <!--
      Pantallas de arranque de iOS. Sin ellas la app instalada abre en blanco.
      Cada medida es el tamaño en píxeles CSS del dispositivo; el PNG va en píxeles reales.
    -->
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="icons/splash/splash-1320x2868.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="icons/splash/splash-1290x2796.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="icons/splash/splash-1284x2778.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
      href="icons/splash/splash-828x1792.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="icons/splash/splash-1206x2622.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="icons/splash/splash-1179x2556.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="icons/splash/splash-1170x2532.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="icons/splash/splash-1125x2436.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
      href="icons/splash/splash-750x1334.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
      href="icons/splash/splash-2048x2732.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
      href="icons/splash/splash-1668x2388.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
      href="icons/splash/splash-1536x2048.png"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
